# Paths are relative to THIS file. The base configuration (config/config.yaml) is copied into the study folder when a study
# starts, so editing config.yaml afterwards neither changes nor blocks a running / resumed study.
# Fixed accuracy: no tolerance options (tol, compl_inf_tol, ...) are tuned; they stay as in config.yaml. A gain therefore
# cannot come from solving less accurately. Constraints apply to every run: residuals, solver failures, steps at the limit, cost.
# ISPD-IPM. IPOPT (warm start) drives the plant, so the trajectory does not depend on the ISPD candidate.
# Gate hit_fraction <= 0.002: at most 7 steps of the 3863-step cycle may reach the iteration limit (the tuned IPOPT cold in config.yaml reaches
# it in 1-3 steps at N=30). At the 300-step screening length that means no step at all.
method: tpe
experiment:
  type: macc
  binary: ../../../build/macc/bin/macc_run
  config: ../../../config/config.yaml
  target: ispd
  driver: ipopt_warm
  init: fixed
  max_iterations: 120
  reference_residual: 0.0001
  require_reference_convergence: true
parameters:
- key: ispd_settings.step_size_strategy
  kind: cat
  choices:
  - 0
  - 1
  - 2
  - 3
  default: 0
- key: ispd_settings.ineq_backtracking_step_min
  kind: float
  low: 0.05
  high: 1.0
  default: 1.0
- key: ispd_settings.aux_backtracking_step_min
  kind: float
  low: 0.05
  high: 1.0
  default: 0.8
- key: ispd_settings.kappa_initial
  kind: log
  low: 0.0001
  high: 10.0
  default: 0.001
- key: ispd_settings.update_kappa_strategy
  kind: cat
  choices:
  - 0
  - 1
  - 2
  - 3
  default: 0
- key: ispd_settings.kappa_update_factor
  kind: log
  low: 1.5
  high: 100.0
  default: 15.0
- key: ispd_settings.kappa_final
  kind: log
  low: 100.0
  high: 100000.0
  default: 1500.0
- key: ispd_settings.tau
  kind: float
  low: 1.01
  high: 4.0
  default: 1.4
- key: ispd_settings.limit_kappa_final
  kind: cat
  choices:
  - 0
  - 1
  default: 1
- key: ispd_settings.slack_variable_initial_ineq
  kind: log
  low: 0.1
  high: 1000.0
  default: 10.0
- key: ispd_settings.lagrange_multiplier_initial_ineq
  kind: log
  low: 0.1
  high: 1000.0
  default: 10.0
- key: ispd_settings.ineq_prediction_param
  kind: float
  low: 0.1
  high: 2.0
  default: 1.0
- key: ispd_settings.aux_scaling_factor
  kind: float
  low: 0.01
  high: 0.9
  default: 0.2
- key: ispd_settings.aux_correction_value
  kind: log
  low: 0.1
  high: 10.0
  default: 1.0
- key: general_settings.num_inner_iterations_max
  kind: int
  low: 1
  high: 20
  default: 10
- key: cg2o.equality_regularization
  kind: cat
  choices:
  - 0.0
  - 1.0e-08
  - 1.0e-06
  default: 0.0
objective:
  metric: iterations
  mode: relative
constraints:
- metric: eq_max
  limit: 0.0001
- metric: ineq_max
  limit: 0.0001
- metric: fail_fraction
  limit: 0
- metric: hit_fraction
  limit: 0.002
- metric: cost_excess_mean
  limit: 0.0001
settings:
  cases:
  - 3
  - 15
  - 30
  screening_fidelity: 300
  validation_fidelity: 0
  validation_repeats: 1
  validate_top: 5
  jobs: 3
  seed: 1
  strategy_options:
    startup: 60
relations:
- left: ispd_settings.kappa_initial
  right: ispd_settings.kappa_final
  op: <=
