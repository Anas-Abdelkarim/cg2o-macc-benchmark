# Edit binary/config paths. Strict gates may yield no winner; inspect failures before changing thresholds.
method: tpe
experiment:
  type: macc
  binary: ../../MACC/build/macc/bin/macc_run
  config: ../../MACC/config/config.yaml
  target: al
  driver: ispd
  max_iterations: 120
  reference_residual: 0.0001
  require_reference_convergence: true
  init: fixed
parameters:
- key: general_settings.rho_initial_eq
  kind: log
  default: 0.5
  low: 0.01
  high: 100.0
- key: general_settings.rho_max_eq
  kind: log
  default: 500000.0
  low: 100.0
  high: 100000000.0
- key: general_settings.rho_update_factor_eq
  kind: log
  default: 20.0
  low: 1.5
  high: 100.0
objective:
  metric: iterations
  mode: relative
constraints:
- metric: eq_max
  limit: 0.0001
- metric: ineq_max
  limit: 0.0001
- metric: fail_fraction
  limit: 0
- metric: hit_fraction
  limit: 0
- metric: cost_excess_mean
  limit: 0.0001
settings:
  cases:
  - 3
  - 15
  - 30
  screening_fidelity: 300
  validation_fidelity: 0
  validation_repeats: 3
  validate_top: 5
  jobs: 2
  seed: 1
  strategy_options:
    startup: 30
relations:
- left: general_settings.rho_initial_eq
  right: general_settings.rho_max_eq
  op: <=
