# Numbers reported in the paper (Sec. VI), used by macc_run to print a comparison in
# experiment_info.txt. Keys are the "paper keys" of the solvers; sub keys are the horizons N.
# Times were measured on an Intel Core i9-12900H; they are not expected to match on another machine.
references:
  # Table IV: comparison with the barrier IPM, feasible start (Fig. 2)
  cg2o_ispd_feasible:
    source: "Table IV, cg2o (feasible start)"
    3:  {iter_avg: 13.0, iter_min: 10, iter_max: 17, time_avg_ms: 0.121, time_max_ms: 0.365}
    15: {iter_avg: 14.9, iter_min: 13, iter_max: 30, time_avg_ms: 0.582, time_max_ms: 1.06}
    30: {iter_avg: 15.7, iter_min: 14, iter_max: 50, time_avg_ms: 1.26,  time_max_ms: 6.32}
  cg2o_bipm_feasible:
    source: "Table IV, barrier IPM [6], tuned (feasible start)"
    3:  {iter_avg: 18.8, iter_min: 13, iter_max: 26,  time_avg_ms: 0.178, time_max_ms: 1.81}
    15: {iter_avg: 26.3, iter_min: 19, iter_max: 120, time_avg_ms: 1.08,  time_max_ms: 17.7}
    30: {iter_avg: 34.1, iter_min: 20, iter_max: 120, time_avg_ms: 3.32,  time_max_ms: 45.3}
  # Table V: comparison with IPOPT (HSL MA57), initial guess 10 (Fig. 3)
  cg2o_ispd_fixed:
    source: "Table V, cg2o, cold (initial guess 10)"
    3:  {iter_avg: 13.2, iter_max: 18, time_avg_ms: 0.187, time_max_ms: 0.322}
    15: {iter_avg: 15.1, iter_max: 31, time_avg_ms: 0.792, time_max_ms: 1.49}
    30: {iter_avg: 15.9, iter_max: 34, time_avg_ms: 1.64,  time_max_ms: 3.29}
  ipopt_cold:
    source: "Table V, IPOPT with MA57, cold (initial guess 10)"
    3:  {iter_avg: 19.5, iter_max: 90,  time_avg_ms: 2.09, time_max_ms: 12.4}
    15: {iter_avg: 22.5, iter_max: 116, time_avg_ms: 4.41, time_max_ms: 33.7}
    30: {iter_avg: 27.6, iter_max: 120, time_avg_ms: 7.55, time_max_ms: 64.0}
  ipopt_warm:
    source: "Table V, IPOPT with MA57, warm (previous solution)"
    3:  {iter_avg: 12.8, iter_max: 48,  time_avg_ms: 1.28, time_max_ms: 6.31}
    15: {iter_avg: 17.6, iter_max: 70,  time_avg_ms: 3.20, time_max_ms: 12.8}
    30: {iter_avg: 19.8, iter_max: 120, time_avg_ms: 5.15, time_max_ms: 26.0}
